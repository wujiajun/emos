[project]
name = "emos"
version = "0.1.0"
description = "Command-line simulation of an e-commerce order management system with role-based access (CMPS-3000 Project 1)."
readme = "README.md"
authors = [
    { name = "Jason", email = "wujiajun1020@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
emos = "emos.main:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

